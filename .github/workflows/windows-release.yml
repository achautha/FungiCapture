name: Windows installer release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      YOLO_AUTOINSTALL: 'false'
      YOLO_OFFLINE: 'true'
      MPLBACKEND: Agg
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install CPU runtime and build dependencies
        shell: pwsh
        run: |
          python -m pip install torch==2.7.1+cpu torchvision==0.22.1+cpu --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install '.[gui,model]' -c packaging/windows-constraints.txt 'pyinstaller>=6,<7' 'pyinstaller-hooks-contrib>=2025.0' pip-licenses pytest
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip uninstall -y opencv-python opencv-contrib-python opencv-contrib-python-headless opencv-python-headless
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install --force-reinstall --no-deps 'opencv-python-headless>=4.8'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Test source and CPU runtime without model weights
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
        run: |
          python -m pytest tests -o addopts='' -q
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python packaging/check_sam_runtime.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Freeze application and record provenance
        shell: pwsh
        run: |
          python -m PyInstaller packaging/fungicapture.spec --noconfirm --clean
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item LICENSE, NOTICE.md, packaging/tokenizer-LICENSE.txt dist/FungiCapture
          Copy-Item docs/RELEASE_NOTES_0.1.0-rc.1.md dist/FungiCapture
          python -m piplicenses --format=markdown --with-urls --output-file dist/FungiCapture/THIRD_PARTY_LICENSES.md
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip freeze | Set-Content dist/FungiCapture/runtime-requirements.txt
          $pythonLicense = python -c "import sys; from pathlib import Path; print(Path(sys.base_prefix) / 'LICENSE.txt')"
          Copy-Item $pythonLicense dist/FungiCapture/PYTHON-LICENSE.txt
          $version = python -c 'import fungicapture; print(fungicapture.__version__)'
          if ($version -ne '0.1.0rc1') { throw "Unexpected version: $version" }
          @{ version=$version; commit=$env:GITHUB_SHA; profile='CPU SAM runtime; no weights'; signed=$false; run=$env:GITHUB_RUN_ID } |
            ConvertTo-Json | Set-Content dist/FungiCapture/BUILD-INFO.json
      - name: Install verified Inno Setup compiler
        shell: pwsh
        run: |
          $file = "$env:RUNNER_TEMP\innosetup.exe"
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe' -OutFile $file
          if ((Get-FileHash $file -Algorithm SHA256).Hash -ne '8A5A6711C3766A6E5FB74F280BA0E3551E719CE94538D901FDBD1F8F9920B3F0') { throw 'Inno Setup checksum mismatch' }
          $process = Start-Process $file -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -Wait -PassThru
          if ($process.ExitCode) { throw "Inno Setup install failed: $($process.ExitCode)" }
      - name: Compile installer and matching source archive
        shell: pwsh
        run: |
          & "$env:ProgramFiles\Inno Setup 7\ISCC.exe" /DAppVersion=0.1.0rc1 packaging/windows.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git archive --format=zip --output=dist/installer/FungiCapture-0.1.0rc1-source.zip HEAD
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item dist/FungiCapture/BUILD-INFO.json dist/installer
          Get-ChildItem dist/installer -File | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content dist/installer/SHA256SUMS.txt
      - name: Verify installed app and upgrade from 0.0.1
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 0.0.1 --pattern '*windows-x64-setup.exe' --dir previous-release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./packaging/verify_windows.ps1 -Installer dist/installer/FungiCapture-0.1.0rc1-windows-x64-setup.exe -PreviousInstaller previous-release/FungiCapture-0.0.1-windows-x64-setup.exe -Evidence candidate-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-build-evidence
          path: |
            candidate-evidence
            build/fungicapture/warn-fungicapture.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/installer
          if-no-files-found: error
          compression-level: 0
